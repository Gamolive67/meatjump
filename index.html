<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover  → canvas reaches behind notch/Dynamic Island on iPhone
    width=device-width  → no 980px desktop viewport emulation on Android
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- iOS PWA / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MEAT JUMP" />

  <!-- Android Chrome PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0D0D0D" />

  <title>$MEAT JUMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0D0D0D;
      overflow: hidden;

      /* Prevent iOS rubber-band / bounce scrolling behind the canvas */
      overscroll-behavior: none;

      /* Block all touch gestures so they don't bubble to the browser */
      touch-action: none;

      /* No text selection on long-press */
      user-select: none;
      -webkit-user-select: none;

      /* Prevent iOS callout popup on long-press */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      /*
        Use safe-area-inset env() vars so the canvas sits inside
        notches, Dynamic Island, and Android navigation bars.
        Falls back to 0px on desktop.
      */
      width:  100%;
      height: 100%;
      height: 100dvh;   /* real visible height on mobile browsers */
      padding-top:    env(safe-area-inset-top,    0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left:   env(safe-area-inset-left,   0px);
      padding-right:  env(safe-area-inset-right,  0px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      /* Prevent iOS from showing a highlight on tap */
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <link rel="modulepreload" crossorigin href="./assets/phaser-_OX62G0t.js">
</head>
<body>
  <div id="game-container"></div>
</body>
</html>
